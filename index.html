<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Giọng Nói Thành Văn Bản Tiếng Việt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg mx-auto bg-slate-800/85 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-6 shadow-2xl">
        
        <!-- Header -->
        <div class="flex flex-col items-center text-center mb-5">
            <div id="mic-icon" class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-indigo-500 rounded-full flex items-center justify-center text-2xl shadow-lg mb-2 shadow-indigo-500/30 transition-all">
                🎙️
            </div>
            <h1 class="text-xl font-bold tracking-tight">Speech-to-Text VN</h1>
            <p class="text-xs text-slate-400 mt-1">Trích xuất văn bản từ File & Xuất file Word</p>
        </div>

        <!-- Tabs Switcher -->
        <div class="grid grid-cols-3 gap-1 bg-slate-900/80 p-1 rounded-2xl mb-5 border border-slate-700/60">
            <button onclick="switchTab('record')" id="tab-record" class="py-2 text-xs font-semibold rounded-xl bg-indigo-600 text-white transition-all shadow">🎙️ Ghi âm</button>
            <button onclick="switchTab('upload')" id="tab-upload" class="py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all">📁 Tải file</button>
            <button onclick="switchTab('link')" id="tab-link" class="py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all">🔗 Dán link</button>
        </div>

        <!-- Tab 1: Ghi âm trực tiếp -->
        <div id="section-record" class="space-y-4">
            <div class="flex gap-3">
                <button id="start-btn" onclick="startRecording()" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm text-white">
                    <span>🔴 Bắt đầu nói</span>
                </button>
                <button id="stop-btn" onclick="stopRecording()" disabled class="flex-1 py-3 px-4 bg-slate-700 text-slate-400 font-semibold rounded-2xl transition-all flex items-center justify-center gap-2 text-sm cursor-not-allowed">
                    <span>⏹️ Dừng lại</span>
                </button>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Văn bản nhận được từ micro:</label>
                <textarea id="result-text" rows="4" class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl p-3 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 resize-none" placeholder="Chữ sẽ hiện ra ở đây khi bạn nói..."></textarea>
            </div>
            <div class="flex gap-2">
                <button onclick="copyText('result-text')" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-xl transition-all">📋 Sao chép</button>
                <button onclick="exportToWord('result-text')" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-xs font-semibold rounded-xl transition-all text-white">📥 Tải file Word</button>
                <button onclick="clearText('result-text')" class="py-2.5 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-xl border border-red-500/20 transition-all">🗑️ Xóa</button>
            </div>
        </div>

        <!-- Tab 2: Tải file lên -->
        <div id="section-upload" class="hidden space-y-4">
            <div class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-4 text-center transition-all cursor-pointer bg-slate-900/40" onclick="document.getElementById('audio-file').click()">
                <div class="text-2xl mb-1">📂</div>
                <div class="text-xs font-semibold text-slate-200">Nhấn để chọn file âm thanh / video</div>
                <div class="text-[10px] text-slate-400 mt-0.5">Hỗ trợ MP3, WAV, MP4</div>
                <input type="file" id="audio-file" accept="audio/*,video/*" class="hidden" onchange="handleFileUpload(event)">
            </div>
            
            <div id="file-info" class="text-xs text-indigo-300 hidden text-center bg-indigo-950/40 py-1.5 px-3 rounded-xl border border-indigo-900/50 truncate"></div>

            <!-- Trình phát Audio/Video ẩn/hiện để nghe file -->
            <div id="audio-player-container" class="hidden">
                <audio id="uploaded-audio-element" controls class="w-full h-10 rounded-xl"></audio>
                <div class="flex gap-2 mt-2">
                    <button onclick="transcribeAudioFile()" id="transcribe-file-btn" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-xl text-white transition-all shadow">▶️ Tự động nhận diện thành văn bản</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Văn bản kết quả từ file:</label>
                <textarea id="upload-result-text" rows="4" class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl p-3 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 resize-none" placeholder="Nội dung văn bản sẽ xuất hiện ở đây khi chạy hoặc bạn có thể chỉnh sửa trực tiếp..."></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="copyText('upload-result-text')" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-xl transition-all">📋 Sao chép</button>
                <button onclick="exportToWord('upload-result-text')" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-xs font-semibold rounded-xl transition-all text-white">📥 Tải file Word</button>
                <button onclick="clearText('upload-result-text')" class="py-2.5 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-xl border border-red-500/20 transition-all">🗑️ Xóa</button>
            </div>
        </div>

        <!-- Tab 3: Dán link -->
        <div id="section-link" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Dán đường dẫn (URL) trang web hoặc công cụ:</label>
                <div class="flex gap-2">
                    <input type="text" id="target-link" class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="https://example.com">
                    <button onclick="openLink()" class="py-2 px-4 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-xl transition-all text-white">Truy cập</button>
                </div>
            </div>
            <div class="space-y-2 pt-2">
                <div class="text-xs font-medium text-slate-400">Liên kết nhanh:</div>
                <div class="grid grid-cols-2 gap-2">
                    <a href="https://translate.google.com" target="_blank" class="p-2.5 bg-slate-900/80 hover:bg-slate-700 border border-slate-700/60 rounded-xl text-xs flex items-center gap-2 transition-all">🌐 Google Translate</a>
                    <a href="https://zalo.me" target="_blank" class="p-2.5 bg-slate-900/80 hover:bg-slate-700 border border-slate-700/60 rounded-xl text-xs flex items-center gap-2 transition-all">💬 Zalo hỗ trợ</a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-5 text-xs text-slate-500">
            Speech-to-Text VN &bull; Xuất Word trực tiếp
        </div>
    </div>

    <script>
        function switchTab(tab) {
            ['record', 'upload', 'link'].forEach(t => {
                document.getElementById('section-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).className = "py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all";
            });
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).className = "py-2 text-xs font-semibold rounded-xl bg-indigo-600 text-white transition-all shadow";
        }

        let recognition;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = document.getElementById('result-text').value;
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                document.getElementById('result-text').value = finalTranscript + interimTranscript;
            };

            recognition.onerror = function(event) { stopRecording(); };
            recognition.onend = function() { if (isRecording) { recognition.start(); } };
        }

        function startRecording() {
            if (!recognition) { alert('Trình duyệt không hỗ trợ!'); return; }
            isRecording = true;
            recognition.start();
            document.getElementById('start-btn').className = "flex-1 py-3 px-4 bg-red-600 animate-pulse font-semibold rounded-2xl shadow-lg shadow-red-600/30 transition-all flex items-center justify-center gap-2 text-sm text-white";
            document.getElementById('start-btn').innerText = "Đang nghe...";
            let stopBtn = document.getElementById('stop-btn');
            stopBtn.disabled = false;
            stopBtn.className = "flex-1 py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-2xl transition-all flex items-center justify-center gap-2 text-sm cursor-pointer";
            document.getElementById('mic-icon').classList.add('scale-110', 'ring-4', 'ring-red-500/50');
        }

        function stopRecording() {
            if (!recognition) return;
            isRecording = false;
            recognition.stop();
            let startBtn = document.getElementById('start-btn');
            startBtn.className = "flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm text-white";
            startBtn.innerText = "🔴 Bắt đầu nói";
            let stopBtn = document.getElementById('stop-btn');
            stopBtn.disabled = true;
            stopBtn.className = "flex-1 py-3 px-4 bg-slate-700 text-slate-400 font-semibold rounded-2xl transition-all flex items-center justify-center gap-2 text-sm cursor-not-allowed";
            document.getElementById('mic-icon').classList.remove('scale-110', 'ring-4', 'ring-red-500/50');
        }

        function copyText(id) {
            const textBox = document.getElementById(id);
            textBox.select();
            navigator.clipboard.writeText(textBox.value);
            alert('Đã sao chép văn bản!');
        }

        function clearText(id) {
            document.getElementById(id).value = '';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const info = document.getElementById('file-info');
                info.innerText = `Đã nhận file: ${file.name}`;
                info.classList.remove('hidden');

                const audioEl = document.getElementById('uploaded-audio-element');
                audioEl.src = URL.createObjectURL(file);
                document.getElementById('audio-player-container').classList.remove('hidden');
                
                document.getElementById('upload-result-text').value = 
                    `[Đã tải lên file: ${file.name}]\nBạn có thể nhấn nút "Tự động nhận diện thành văn bản" bên trên, hoặc chỉnh sửa nội dung trực tiếp tại đây trước khi bấm tải file Word.`;
            }
        }

        let fileRecognition = null;
        function transcribeAudioFile() {
            const audioEl = document.getElementById('uploaded-audio-element');
            if (!audioEl.src) {
                alert('Vui lòng chọn file trước!');
                return;
            }

            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                alert('Trình duyệt không hỗ trợ nhận diện giọng nói!');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            fileRecognition = new SpeechRecognition();
            fileRecognition.lang = 'vi-VN';
            fileRecognition.continuous = true;
            fileRecognition.interimResults = true;

            fileRecognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript + ' ';
                }
                document.getElementById('upload-result-text').value += ' ' + transcript;
            };

            audioEl.play();
            fileRecognition.start();
            document.getElementById('transcribe-file-btn').innerText = "Đang chạy nghe file...";
            document.getElementById('transcribe-file-btn').className = "flex-1 py-2 bg-red-600 text-xs font-semibold rounded-xl text-white transition-all shadow animate-pulse";

            audioEl.onended = function() {
                if (fileRecognition) {
                    fileRecognition.stop();
                }
                document.getElementById('transcribe-file-btn').innerText = "▶️ Hoàn thành! Nghe lại";
                document.getElementById('transcribe-file-btn').className = "flex-1 py-2 bg-green-600 text-xs font-semibold rounded-xl text-white transition-all shadow";
            };
        }

        function exportToWord(id) {
            const text = document.getElementById(id).value;
            if (!text.trim()) {
                alert('Không có văn bản để xuất file!');
                return;
            }
            const htmlContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>Export Document</title></head>
            <body style='font-family: Arial, sans-serif; font-size: 14pt; line-height: 1.6;'>
                <p>${text.replace(/\n/g, '<br>')}</p>
            </body>
            </html>`;

            const blob = new Blob(['\ufeff' + htmlContent], {
                type: 'application/msword'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Van_Ban_Chuyen_Doi.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openLink() {
            let url = document.getElementById('target-link').value.trim();
            if (url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                window.open(url, '_blank');
            } else {
                alert('Vui lòng nhập đường dẫn hợp lệ!');
            }
        }
    </script>
</body>
</html>
