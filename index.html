<script>
        function switchTab(tab) {
            ['record', 'upload'].forEach(t => {
                document.getElementById('section-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).className = "py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all";
            });
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).className = "py-2.5 text-xs font-semibold rounded-xl bg-indigo-600 text-white transition-all shadow";
        }

        let recognition, fileRealRecognition;
        let audioCtx, sourceNode, destinationNode;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.onresult = function(event) {
                let interim = '';
                let final = document.getElementById('result-text').value;
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript + ' ';
                    else interim += event.results[i][0].transcript;
                }
                document.getElementById('result-text').value = final + interim;
            };
        }

        function startRecording() {
            if (!recognition) { alert('Trình duyệt không hỗ trợ!'); return; }
            recognition.start();
            document.getElementById('start-btn').className = "flex-1 py-3 px-4 bg-red-600 animate-pulse font-semibold rounded-2xl shadow-lg shadow-red-600/30 transition-all flex items-center justify-center gap-2 text-sm text-white";
            document.getElementById('start-btn').innerText = "Đang nghe...";
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('stop-btn').className = "flex-1 py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-2xl transition-all flex items-center justify-center gap-2 text-sm cursor-pointer";
        }

        function stopRecording() {
            if (!recognition) return;
            recognition.stop();
            document.getElementById('start-btn').className = "flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm text-white";
            document.getElementById('start-btn').innerText = "🔴 Bắt đầu nói";
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('stop-btn').className = "flex-1 py-3 px-4 bg-slate-700 text-slate-400 font-semibold rounded-2xl transition-all flex items-center justify-center gap-2 text-sm cursor-not-allowed";
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const info = document.getElementById('file-info');
                info.innerText = `Đã chọn file: ${file.name}`;
                info.classList.remove('hidden');

                const audioEl = document.getElementById('uploaded-audio-element');
                audioEl.src = URL.createObjectURL(file);
                document.getElementById('audio-player-container').classList.remove('hidden');
                document.getElementById('upload-result-text').value = "";
            }
        }

        async function startRealFileProcessing() {
            const audioEl = document.getElementById('uploaded-audio-element');
            if (!audioEl.src) { alert('Vui lòng chọn file âm thanh trước!'); return; }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert('Trình duyệt không hỗ trợ nhận diện giọng nói!'); return; }

            fileRealRecognition = new SpeechRecognition();
            fileRealRecognition.lang = 'vi-VN';
            fileRealRecognition.continuous = true;
            fileRealRecognition.interimResults = true;
            
            fileRealRecognition.onresult = function(event) {
                let interim = '';
                let final = document.getElementById('upload-result-text').value;
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript + ' ';
                    else interim += event.results[i][0].transcript;
                }
                document.getElementById('upload-result-text').value = final + interim;
            };

            try {
                // Thiết lập Web Audio API để chuyển luồng phát audio vào bộ nhận diện
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                sourceNode = audioCtx.createMediaElementSource(audioEl);
                destinationNode = audioCtx.createMediaStreamDestination();
                
                sourceNode.connect(destinationNode);
                sourceNode.connect(audioCtx.destination); // Vẫn giữ âm thanh phát ra loa để bạn nghe thấy

                fileRealRecognition.start();
                audioEl.play();

                const btn = document.getElementById('process-file-btn');
                btn.className = "flex-1 py-2.5 bg-red-600 animate-pulse text-xs font-semibold rounded-xl text-white transition-all shadow flex items-center justify-center gap-1.5";
                btn.innerHTML = "<span>🔴 Đang đọc nội dung file...</span>";
                
                const stopBtn = document.getElementById('stop-file-btn');
                stopBtn.disabled = false;
                stopBtn.className = "py-2.5 px-4 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl transition-all cursor-pointer";
            } catch (error) {
                console.error(error);
                alert('Lỗi khởi tạo bộ lọc âm thanh: ' + error.message);
            }
        }

        function stopRealFileProcessing() {
            if (fileRealRecognition) {
                fileRealRecognition.stop();
            }
            const audioEl = document.getElementById('uploaded-audio-element');
            if (audioEl) {
                audioEl.pause();
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
            }
            
            const btn = document.getElementById('process-file-btn');
            if(btn) {
                btn.className = "flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-xl text-white transition-all shadow flex items-center justify-center gap-1.5";
                btn.innerHTML = "<span>⚡ Bắt đầu phân tích file</span>";
            }
            
            const stopBtn = document.getElementById('stop-file-btn');
            if(stopBtn) {
                stopBtn.disabled = true;
                stopBtn.className = "py-2.5 px-4 bg-slate-700 text-slate-400 text-xs font-semibold rounded-xl transition-all cursor-not-allowed";
            }
        }

        function copyText(id) {
            const textBox = document.getElementById(id);
            textBox.select();
            navigator.clipboard.writeText(textBox.value);
            alert('Đã sao chép văn bản!');
        }

        function clearText(id) {
            document.getElementById(id).value = '';
            if(id === 'upload-result-text') stopRealFileProcessing();
        }

        function exportToWord(id) {
            const text = document.getElementById(id).value;
            if (!text.trim()) {
                alert('Không có văn bản để xuất file Word!');
                return;
            }
            const htmlContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>Export Document</title></head>
            <body style='font-family: Arial, sans-serif; font-size: 14pt; line-height: 1.6;'>
                <p>${text.replace(/\n/g, '<br>')}</p>
            </body>
            </html>`;

            const blob = new Blob(['\ufeff' + htmlContent], {
                type: 'application/msword'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Van_Ban_Chuyen_Doi.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
